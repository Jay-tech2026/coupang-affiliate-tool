<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
body{font:14px system-ui;max-width:900px;margin:0 auto;padding:24px;color:#172033}h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:16px 0 7px}.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}input{padding:7px;border:1px solid #ccd1da;border-radius:7px}#keywords{width:280px}.rank-options{display:flex;gap:14px;margin:10px 0;align-items:center}.rank-options label{display:flex;gap:5px;align-items:center;font-weight:650}.rank-options input{width:16px;height:16px}button{padding:8px 11px;border:0;border-radius:7px;font-weight:700;cursor:pointer}button.primary{background:#e84c2a;color:white}button:disabled{opacity:.45;cursor:default}.suggestions{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.suggestions button{font-size:12px;padding:5px 8px;background:#fff3ef;color:#a53620}.status{color:#667085;margin:10px 0}.item{display:grid;grid-template-columns:24px 54px 1fr auto;gap:8px;padding:9px 0;border-top:1px solid #eee;align-items:center}.item img{width:54px;height:54px;object-fit:cover}.name{font-weight:650}.deal{color:#d83c1d}.ranking{color:#52647a;font-size:12px}.one{font-size:12px;padding:7px;background:#eef0f5}.copy-button{font-size:11px;padding:4px 7px;margin-left:6px;background:#e8f0fe;color:#185abc}.item-short{grid-column:2/-1;min-width:0}.short-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center}.item-short a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px;border-radius:6px;color:#185abc;background:#f2f6ff}.item-short a:focus{outline:2px solid #185abc}.history{max-height:260px;overflow:auto}.history-row{display:block;width:100%;text-align:left;padding:9px;background:#fff;border-radius:0;border-top:1px solid #eee}.history-row:not(:disabled):hover,.history-row:not(:disabled):focus{background:#fff3ef}.history-main{font-weight:650}.history-meta{font-size:12px;color:#667085}.error{color:#a52d19;background:#fff0ed;padding:8px;border-radius:7px}
</style></head><body><h1>酷澎高折扣商品</h1><div class="bar"><label>折扣 <input id="min" value="60" size="3">％以上</label><label>評價大於 <input id="reviews" value="200" size="5"></label><input id="keywords" value="" placeholder="輸入商品名稱，可用逗號分隔"><button id="search" class="primary">自行搜尋</button></div><div class="rank-options"><span>搜尋排序：</span><label><input id="rank-score" type="checkbox" checked>酷澎綜合評分</label><label><input id="rank-sales" type="checkbox" checked>最熱銷</label></div><div id="suggestions" class="suggestions"></div><div id="status" class="status">搜尋欄預設空白；可點選下方隨機商品名稱作為參考。</div><div id="items"></div><div class="bar"><button id="links" class="primary" disabled>產生官方短網址</button><button id="csv" disabled>匯出 CSV</button></div><h2>最近搜尋紀錄</h2><div id="history" class="history"><span class="status">尚無搜尋紀錄</span></div><script src="popup.js"></script></body></html>
